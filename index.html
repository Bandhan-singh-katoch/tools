<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
        }

        .container h2 {
            margin-bottom: 20px;
            font-weight: 500;
            text-align: center;
            color: #333;
        }

        .tool-link {
            display: block;
            padding: 12px;
            background-color: #5a67d8;
            color: white;
            text-align: center;
            border-radius: 4px;
            font-size: 16px;
            text-decoration: none;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        .tool-link:hover {
            background-color: #4c51bf;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Tools</h2>
        <a href="query_gen.html" class="tool-link">Query Generator</a>
        <a href="text_format.html" class="tool-link">Text Formatter</a>
    </div>
</body>

</html>
