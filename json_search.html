<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Search and Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            margin: auto;
            max-width: 600px;
        }

        .container h2 {
            margin-bottom: 20px;
            font-weight: 500;
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group textarea,
        .form-group input {
            width: calc(100% - 20px);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px;
            resize: none;
            margin-top: 13px;
        }

        .form-group textarea:focus,
        .form-group input:focus {
            border-color: #5a67d8;
            outline: none;
            box-shadow: 0 0 5px rgba(90, 103, 216, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #5a67d8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #4c51bf;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .result p {
            margin: 5px 0;
        }

        .error {
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>JSON search</h2>

        <div class="form-group">
            <textarea id="arrayInput" placeholder='Enter array of objects (e.g., [{"name": "John", "id": "123"}])'
                rows="6"></textarea>
        </div>
        <button onclick="storeArray()">Store Array</button>

        <div class="form-group">
            <input id="searchInput" placeholder="Search by Name or ID">
        </div>
        <button onclick="searchEmployee()">Search</button>

        <div id="result" class="result" style="display:none;"></div>
        <div id="error" class="error"></div>
    </div>

    <script>
        function storeArray() {
            const input = document.getElementById('arrayInput').value;
            try {
                const array = JSON.parse(input);

                if (!Array.isArray(array)) {
                    throw new Error('Input is not a valid array.');
                }

                localStorage.setItem('employeeArray', JSON.stringify(array));
                alert('Array stored successfully!');
                document.getElementById('arrayInput').value = '';
                document.getElementById('error').textContent = '';
            } catch (error) {
                document.getElementById('error').textContent = error.message;
            }
        }

        function searchEmployee() {
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            const storedArray = localStorage.getItem('employeeArray');

            if (!storedArray) {
                document.getElementById('error').textContent = 'No data found in local storage. Please store an array first.';
                return;
            }

            if (!searchQuery) {
                document.getElementById('error').textContent = 'Pls enter user/id.';
                return;
            }

            const array = JSON.parse(storedArray);
            const result = array.filter(emp =>
                emp.empName.toLowerCase().includes(searchQuery) || emp.empId.toLowerCase().includes(searchQuery)
            );

            const resultContainer = document.getElementById('result');
            resultContainer.style.display = 'block';

            if (result.length > 0) {
                resultContainer.innerHTML = result.map(emp => `<p>Employee Name: ${emp.empName}, Employee ID: ${emp.empId}</p>`).join('');
                document.getElementById('error').textContent = '';
            } else {
                resultContainer.innerHTML = '';
                document.getElementById('error').textContent = 'No matching employees found.';
            }
        }
    </script>
</body>

</html>
